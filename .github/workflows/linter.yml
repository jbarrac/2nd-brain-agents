name: 🧹 Linter de Tareas

on:
  workflow_dispatch:
    inputs:
      reset_semana:
        description: >-
          Resetea la Página Fija de Planificación Semanal desde la Plantilla
          (checks + texto). Acción explícita, NUNCA automática — úsala solo
          cuando el cierre de la semana ya esté revisado/corregido.
        type: boolean
        default: false
  schedule:
    # Lunes 05:00 UTC = 07:00 Madrid (verano) / 06:00 (invierno).
    # Mantiene el KPI "dashboard fresco < 7d" siempre en verde.
    - cron: "0 5 * * 1"

jobs:
  linter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pyyaml

      - name: Ejecutar linter + refrescar dashboard
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TASKS_DB_ID: ${{ secrets.NOTION_TASKS_DB_ID }}
        run: python linter.py --dashboard

      - name: Calcular KPIs personales
        if: github.event.inputs.reset_semana != 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python kpis.py --write

      - name: Resetear Página Fija desde la Plantilla (solo si se pide explícitamente)
        if: github.event.inputs.reset_semana == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python kpis.py --reset-semana

      - name: DIAG — restaurar el resaltado de Semana 2. Tech en Focus Semanal
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python -c "
          import kpis
          for b in kpis.list_block_children(kpis.PLANNING_PAGE_ID):
              if b['type'] == 'bulleted_list_item' and kpis.plain(b, 'bulleted_list_item') == 'Semana 2. Tech':
                  rt = b['bulleted_list_item']['rich_text']
                  for item in rt:
                      item['annotations']['color'] = 'yellow_background'
                  r = kpis.requests.patch(f'https://api.notion.com/v1/blocks/{b[\"id\"]}',
                                          headers=kpis.NOTION_HEADERS,
                                          json={'bulleted_list_item': {'rich_text': rt}})
                  print(b['id'], r.status_code, r.text[:300])
                  break
          else:
              print('No se encontró el bloque Semana 2. Tech')
          "


