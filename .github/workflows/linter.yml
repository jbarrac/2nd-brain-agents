name: 🗓️ Cierre Semanal & Dashboard

# Punto de entrada único de los modos del sistema (ver brain.py).
# Sigue siendo UNO de los 3 workflows del presupuesto Internal: los modos
# viajan como input, no como workflows nuevos.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: >-
          Qué hacer. status/fix no escriben nada. close registra las lecturas,
          repinta el dashboard y archiva. open REEMPLAZA la Página Fija por la
          Plantilla (se niega si la semana no está archivada).
        type: choice
        default: week-status
        options:
          - week-status
          - week-fix
          - week-close
          - week-open
          - dash-status
          - dash-update
  schedule:
    # Lunes 05:00 UTC = 07:00 Madrid (verano) / 06:00 (invierno).
    # Cierra la semana: mantiene el KPI "dashboard fresco < 7d" en verde.
    # NO abre la siguiente — `week open` es siempre manual y explícito, para
    # que Javi pueda revisar y corregir el cierre antes de que se borre nada.
    - cron: "0 5 * * 1"

jobs:
  brain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pyyaml

      - name: Ejecutar modo
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TASKS_DB_ID: ${{ secrets.NOTION_TASKS_DB_ID }}
          # El cron no manda inputs: por defecto, cerrar la semana.
          MODO: ${{ inputs.modo || 'week-close' }}
        run: python brain.py ${MODO/-/ }
