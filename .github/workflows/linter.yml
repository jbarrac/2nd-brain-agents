name: 🧹 Linter de Tareas

on:
  workflow_dispatch:
    inputs:
      reset_semana:
        description: >-
          Resetea la Página Fija de Planificación Semanal desde la Plantilla
          (checks + texto). Acción explícita, NUNCA automática — úsala solo
          cuando el cierre de la semana ya esté revisado/corregido.
        type: boolean
        default: false
  schedule:
    # Lunes 05:00 UTC = 07:00 Madrid (verano) / 06:00 (invierno).
    # Mantiene el KPI "dashboard fresco < 7d" siempre en verde.
    - cron: "0 5 * * 1"

jobs:
  linter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pyyaml

      - name: Ejecutar linter + refrescar dashboard
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TASKS_DB_ID: ${{ secrets.NOTION_TASKS_DB_ID }}
        run: python linter.py --dashboard

      - name: Calcular KPIs personales
        if: github.event.inputs.reset_semana != 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python kpis.py --write

      - name: Resetear Página Fija desde la Plantilla (solo si se pide explícitamente)
        if: github.event.inputs.reset_semana == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python kpis.py --reset-semana

      - name: DIAG — inspeccionar color crudo de Focus Semanal
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python -c "
          import kpis, json
          for b in kpis.list_block_children(kpis.PLANNING_PAGE_ID)[:8]:
              t = b['type']
              texto = kpis.plain(b, t) if t in ('paragraph','bulleted_list_item','heading_2','heading_3') else ''
              rt = b.get(t, {}).get('rich_text', [])
              colores = [i.get('annotations', {}).get('color') for i in rt]
              print(t, '|', texto[:40], '| colores:', colores)
          "


