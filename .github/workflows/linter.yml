name: 🗓️ Cierre Semanal & Dashboard

# Punto de entrada único de los modos del sistema (ver brain.py).
# Sigue siendo UNO de los 3 workflows del presupuesto Internal: los modos
# viajan como input, no como workflows nuevos.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: >-
          Qué hacer. status/fix no escriben nada. close registra las lecturas,
          repinta el dashboard y archiva. retry recupera las lecturas de la
          semana ya cerrada cuyo dato llegó tarde (Coaching rellenado después
          del cierre). open REEMPLAZA la Página Fija por la Plantilla (se
          niega si la semana no está archivada).
        type: choice
        default: week-status
        options:
          - week-status
          - week-fix
          - week-close
          - week-retry
          - week-open
          - dash-status
          - dash-update
  schedule:
    # Lunes 05:00 UTC = 07:00 Madrid (verano) / 06:00 (invierno).
    # Cierra la semana: mantiene el KPI "dashboard fresco < 7d" en verde.
    # NO abre la siguiente — `week open` es siempre manual y explícito, para
    # que Javi pueda revisar y corregir el cierre antes de que se borre nada.
    - cron: "0 5 * * 1"

jobs:
  brain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # requirements.txt en vez de la lista a mano: desde que `week open`
      # regenera el Foco, este workflow también necesita `anthropic`.
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # ANTHROPIC_API_KEY la necesita `week open` para regenerar el Foco tras
      # el reset (el resto de modos no la usan). Sin ella la semana se abre
      # igual, pero el Foco se queda sin poner.
      - name: Ejecutar modo
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TASKS_DB_ID: ${{ secrets.NOTION_TASKS_DB_ID }}
          # El cron no manda inputs: por defecto, cerrar la semana.
          MODO: ${{ inputs.modo || 'week-close' }}
        run: python brain.py ${MODO/-/ }
