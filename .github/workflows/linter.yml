name: 🧹 Linter de Tareas

on:
  workflow_dispatch:
  schedule:
    # Lunes 05:00 UTC = 07:00 Madrid (verano) / 06:00 (invierno).
    # Mantiene el KPI "dashboard fresco < 7d" siempre en verde.
    - cron: "0 5 * * 1"

jobs:
  linter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pyyaml

      - name: Ejecutar linter + refrescar dashboard
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TASKS_DB_ID: ${{ secrets.NOTION_TASKS_DB_ID }}
        run: python linter.py --dashboard

      - name: Calcular KPIs personales
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python kpis.py --write

      - name: Reparar KPIs (puntual)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python reparar_kpis.py
