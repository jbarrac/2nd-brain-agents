name: 🤖 Agente Ejecutor de Tareas
 
on:
  workflow_dispatch:        # además, lanzable a mano cuando quieras
  schedule:
    # Lunes 04:30 UTC = 06:30 Madrid (verano) / 05:30 (invierno).
    # Se ejecuta ANTES del linter (05:00) para que el dashboard semanal ya
    # refleje la tarea que acabe de procesar. Cadencia: ~1 tarea/semana.
    - cron: "30 4 * * 1"
 
jobs:
  run-agent:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Instalar dependencias
        run: pip install -r requirements.txt
 
      - name: Ejecutar agente
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TASKS_DB_ID: ${{ secrets.NOTION_TASKS_DB_ID }}
        run: python agent.py
