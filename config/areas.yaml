  mission: >
    Mantener el 2nd Brain operativo y simple: integridad de datos, dashboard
    actualizado, detección de tareas estancadas, propuestas de mejora acotadas.
  kpis: "Tareas Blocked < 5; 0 tareas In Progress > 7 días; dashboard < 7 días de antigüedad"
